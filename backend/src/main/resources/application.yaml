spring:
  application:
    name: salutem
  server:
    port: 8080
  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        format_sql: true
  flyway:
    enabled: true
  docker:
    compose:
      lifecycle-management: start-only
      file: "./backend/compose.yaml"