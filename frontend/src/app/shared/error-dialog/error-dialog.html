<mat-dialog-content>
    <p class="font-bold">
        {{ data.title }}
    </p>
    <br>
    <p>
        {{ data.detail }}
    </p>

    <p class="mt-3 text-sm text-gray-500">
        Erro {{ data.status }}
    </p>
</mat-dialog-content>

<mat-dialog-actions align="end">
    <button matButton="filled" mat-dialog-close>
        OK
    </button>
</mat-dialog-actions>
